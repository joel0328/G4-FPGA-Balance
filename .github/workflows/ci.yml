name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: RTL sim + driver replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog
      - name: make test
        run: make test

  model:
    name: Balancer simulator
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Self-checks
        run: python check_model.py
      - name: Balance and push scenario
        run: python sim.py
      - name: Wheel-legged course
        run: python legged_sim.py
      - name: Design sweep
        run: python sweep.py --vary battery_height=0.04,0.10,0.16 --vary wheel_radius=0.0325,0.04,0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balancer-sim
          path: |
            model/out/run.png
            model/out/legged.png
            model/out/sweep.csv

  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
      - name: Build
        run: make -C firmware/FPGA_Link
      - uses: actions/upload-artifact@v4
        with:
          name: FPGA_Link-firmware
          path: |
            firmware/FPGA_Link/build/FPGA_Link.bin
            firmware/FPGA_Link/build/FPGA_Link.hex
            firmware/FPGA_Link/build/FPGA_Link.elf
            firmware/FPGA_Link/build/FPGA_Link.map
